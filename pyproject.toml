[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-mask-studio"
version = "1.0.0"
description = "Aplicação desktop local-first para preparação de dados, anonimização e mascaramento determinístico com restauração controlada."
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<7",
    "cryptography>=50.0.1,<51",
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<1",
]

[project.urls]
Repository = "https://github.com/Gustavo-Wallace/data-mask-studio"
Releases = "https://github.com/Gustavo-Wallace/data-mask-studio/releases"
Issues = "https://github.com/Gustavo-Wallace/data-mask-studio/issues"
Changelog = "https://github.com/Gustavo-Wallace/data-mask-studio/blob/main/CHANGELOG.md"
Security = "https://github.com/Gustavo-Wallace/data-mask-studio/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "PyInstaller>=6.11,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"data_mask_studio.i18n" = ["catalogs/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
